server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: ms-auth
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/auth_db}
    username: ${DB_USER:nexo}
    password: ${DB_PASSWORD:nexo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # db/seed carga los usuarios de prueba. En producción: FLYWAY_LOCATIONS=classpath:db/migration
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}

nexo:
  security:
    issuer: ${JWT_ISSUER:nexo-auth}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    max-failed-attempts: 5
    # Claves privadas RSA en PEM PKCS#8. Si están vacías se generan claves efímeras (solo desarrollo).
    signing-key: ${JWT_SIGNING_KEY:}
    encryption-key: ${JWT_ENCRYPTION_KEY:}
  services:
    customer-url: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
    accounts-url: ${ACCOUNTS_SERVICE_URL:http://localhost:8083}
    internal-api-key: ${INTERNAL_API_KEY:dev-internal-key-change-me}
    connect-timeout: 2s
    read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
