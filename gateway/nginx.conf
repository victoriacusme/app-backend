# Gateway de Nexo: única puerta de entrada para la app.
# Ruteo por prefijo, correlation-id, rate limit, timeouts y bloqueo de rutas internas.
# Los micros se alcanzan a través de Toxiproxy (ver chaos/) para poder simular latencia y caídas.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 64k;

    # Se respeta el correlation-id de la app si es válido; si no, se usa el id de petición de Nginx.
    map $http_x_correlation_id $correlation_id {
        "~^[A-Za-z0-9._-]{1,64}$" $http_x_correlation_id;
        default                   $request_id;
    }

    log_format main '$remote_addr "$request" $status ${request_time}s '
                    'upstream=$upstream_addr ${upstream_response_time}s cid=$correlation_id';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    # Login: límite estricto por IP contra fuerza bruta (el bloqueo por usuario lo hace ms-auth).
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    upstream ms_auth {
        server toxiproxy:18081;
        keepalive 16;
    }

    upstream ms_customer {
        server toxiproxy:18082;
        keepalive 16;
    }

    upstream ms_accounts {
        server toxiproxy:18083;
        keepalive 16;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $correlation_id;
    # El gateway agrega su propio X-Correlation-Id a la respuesta: se oculta el del micro para no duplicarlo.
    proxy_hide_header X-Correlation-Id;

    # Un micro lento no debe retener la conexión de la app indefinidamente.
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    # Nunca reintentar en el gateway: un POST de dinero no es seguro de repetir.
    proxy_next_upstream off;

    server {
        listen 8080;

        add_header X-Correlation-Id $correlation_id always;
        default_type application/problem+json;

        error_page 429 = @rate_limited;
        error_page 502 503 504 = @unavailable;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP"}';
        }

        # Rutas servicio a servicio y de administración: nunca se exponen hacia afuera.
        location ~* ^/(internal|actuator)(/|$) {
            return 404 '{"type":"https://api.nexo.ec/problems/not-found","title":"Not Found","status":404,"code":"not-found","correlationId":"$correlation_id"}';
        }

        # --- ms-auth ---
        location = /auth/login {
            limit_req zone=login_limit burst=10 nodelay;
            proxy_pass http://ms_auth;
        }

        location /auth/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://ms_auth;
        }

        location = /.well-known/jwks.json {
            proxy_pass http://ms_auth;
        }

        # --- ms-accounts ---
        location = /accounts {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://ms_accounts;
        }

        location /accounts/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://ms_accounts;
        }

        location / {
            return 404 '{"type":"https://api.nexo.ec/problems/not-found","title":"Not Found","status":404,"code":"not-found","correlationId":"$correlation_id"}';
        }

        location @rate_limited {
            add_header Retry-After 60 always;
            add_header X-Correlation-Id $correlation_id always;
            return 429 '{"type":"https://api.nexo.ec/problems/rate-limited","title":"Too Many Requests","status":429,"code":"rate-limited","detail":"Demasiadas solicitudes. Espera un momento e intenta nuevamente.","correlationId":"$correlation_id"}';
        }

        # Micro caído, inalcanzable o que excedió el timeout: la app recibe el mismo formato de error de siempre.
        location @unavailable {
            add_header X-Correlation-Id $correlation_id always;
            return 503 '{"type":"https://api.nexo.ec/problems/service-unavailable","title":"Service Unavailable","status":503,"code":"service-unavailable","detail":"El servicio no está disponible en este momento. Intenta nuevamente.","correlationId":"$correlation_id"}';
        }
    }
}
