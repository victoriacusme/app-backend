server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: ms-customer
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/customer_db}
    username: ${DB_USER:nexo}
    password: ${DB_PASSWORD:nexo}
    hikari:
      # Falla rápido si la BD no responde, en lugar de dejar la petición colgada 30 s.
      connection-timeout: 3000  # ms
      validation-timeout: 2000  # ms
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      jakarta.persistence.query.timeout: 5000
  flyway:
    # db/seed carga clientes y experiencias de prueba. En producción: FLYWAY_LOCATIONS=classpath:db/migration
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
    # Las semillas usan V100+: sin esto, una migración nueva del esquema (V2, V3...) no se aplicaría en una BD
    # de desarrollo que ya tiene la semilla. En producción no hay semillas y el orden es el natural.
    out-of-order: ${FLYWAY_OUT_OF_ORDER:true}
  transaction:
    default-timeout: 10s

nexo:
  security:
    jwt-issuer: ${JWT_ISSUER:nexo-auth}
    jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    jwks-connect-timeout: 2s
    jwks-read-timeout: 3s
    internal-api-key: ${INTERNAL_API_KEY:dev-internal-key-change-me}
  experience:
    zone: ${EXPERIENCE_ZONE:America/Guayaquil}

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
